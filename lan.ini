; GBFR LAN settings. Copied next to the game exe on install.
; Reloaded at process start (server exe and shims).
;
; Same PC / Nucleus: host = 127.0.0.1
; Other PCs on your LAN: set host to the machine running gbfr-lan-server.exe

[server]
host = 127.0.0.1
port = 8080
ws_port = 8081

[lobby]
; Hard cap per lobby (and the Party mesh join list). 2-32.
max_players = 8
; true  = ignore the game's MaxPlayers and use max_players above
; false = trust the create body (shipping Relink sends 4)
override_game_max = true

[party]
; 0 = random high port. 27015 is easier to allow through Windows Firewall.
udp_port = 27015
; Blank = auto-detect a LAN IPv4 (even if [server] host is 127.0.0.1).
; Set this PC's LAN address if the mesh still advertises 127.0.0.1.
advertise_ip =

[debug]
; Verbose logging for troubleshooting: per-message Party traffic, payload hex samples,
; quest/queue probes, and one line per broker request.
; false = errors and warnings only (recommended for normal play; the broker still prints
; non-poll request activity to its console).
; GBFR_LAN_DEBUG=1 overrides this for a single process.
enabled = false
